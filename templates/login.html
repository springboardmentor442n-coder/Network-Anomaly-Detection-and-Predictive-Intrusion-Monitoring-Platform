<!DOCTYPE html>
<html>

<head>

    <title>Network Security Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 400px;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.3);
        }

        .logo {
            text-align: center;
            font-size: 45px;
        }

        h1 {
            text-align: center;
            color: #243b55;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            font-weight: bold;
            color: #444;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 8px 0 18px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #243b55;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #141e30;
        }

        .success {
            background: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 7px;
            text-align: center;
            margin-bottom: 18px;
            font-weight: bold;
        }

        .error {
            background: #ffe5e5;
            color: #d60000;
            padding: 12px;
            border-radius: 7px;
            text-align: center;
            margin-bottom: 18px;
        }

        .register {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }

        .register a {
            color: #243b55;
            font-weight: bold;
            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="login-box">

    <div class="logo">🛡️</div>

    <h1>Network Security</h1>

    <div class="subtitle">
        Intrusion Monitoring Platform
    </div>


    {% if message %}

    <div class="success" id="successMessage">
        {{ message }}
    </div>

    <script>

        setTimeout(function() {

            var message =
                document.getElementById("successMessage");

            if (message) {
                message.style.display = "none";
            }

        }, 5000);

    </script>

    {% endif %}


    {% if error %}

    <div class="error">
        {{ error }}
    </div>

    {% endif %}


    <form action="/login" method="POST">

        <label>Username</label>

        <input
            type="text"
            name="username"
            placeholder="Enter username"
            required
        >


        <label>Password</label>

        <input
            type="password"
            name="password"
            placeholder="Enter password"
            required
        >


        <button type="submit">
            Login
        </button>

    </form>


    <div class="register">

        Don't have an account?

        <a href="/register">
                Register
        </a>

    </div>

</div>

</body>

</html>
