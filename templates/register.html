```html
<!DOCTYPE html>
<html>
<head>
    <title>Create Account</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .register-box {
            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #243b55;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0 15px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 7px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #243b55;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #141e30;
        }

        .error {
            color: red;
            text-align: center;
            margin-bottom: 15px;
        }

        .login {
            text-align: center;
            margin-top: 20px;
        }

        .login a {
            color: #243b55;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="register-box">

    <h1>🛡️ Create Account</h1>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form action="/register" method="POST">

        <input
            type="text"
            name="username"
            placeholder="Enter username"
            required
        >

        <input
            type="email"
            name="email"
            placeholder="Enter email"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Create password"
            required
        >

        <button type="submit">
            Create Account
        </button>

    </form>

    <div class="login">
        Already have an account?
        <a href="/">Login</a>
    </div>

</div>

</body>
</html>
```
