<!DOCTYPE html>
<html>
<head>
  <title>NetShield AI - Sign Up</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="spotlight"></div>
  <div class="login-container">
    <canvas id="matrixCanvas" class="matrix-canvas"></canvas>
    <div class="login-card">
      <h2>Create Account</h2>
      <input type="email" id="username" placeholder="Enter your email">
      <input type="password" id="password" placeholder="Choose a password">
      <button onclick="signup()">Sign Up</button>
      <p id="error"></p>
      <p style="margin-top:16px; font-size:13px;"><a href="login.html" style="color:#00FF41;">Already have an account? Log in</a></p>
    </div>
  </div>

  <script>
    async function signup() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      if (!username || !password) {
        document.getElementById('error').innerText = 'Please fill in both fields.';
        return;
      }

      const response = await fetch('http://127.0.0.1:8000/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      if (response.ok) {
        const data = await response.json();
        localStorage.setItem('token', data.access_token);
        window.location.href = 'dashboard.html';
      } else if (response.status === 422) {
        document.getElementById('error').innerText = 'Please enter a valid email address.';
      } else {
        const data = await response.json();
        document.getElementById('error').innerText = data.detail || 'Signup failed.';
      }
    }

    document.addEventListener('mousemove', (e) => {
      const glow = document.getElementById('spotlight');
      if (glow) { glow.style.left = e.clientX + 'px'; glow.style.top = e.clientY + 'px'; }
    });

    function startMatrixRain() {
      const canvas = document.getElementById('matrixCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      function resize() {
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      const chars = 'アイウエオカキクケコサシスセソ01';
      const fontSize = 14;
      let columns = Math.floor(canvas.width / fontSize);
      let drops = Array(columns).fill(1);

      function draw() {
        ctx.fillStyle = 'rgba(5, 7, 5, 0.08)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#00FF41';
        ctx.font = fontSize + 'px monospace';
        for (let i = 0; i < drops.length; i++) {
          const text = chars[Math.floor(Math.random() * chars.length)];
          ctx.fillText(text, i * fontSize, drops[i] * fontSize);
          if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
            drops[i] = 0;
          }
          drops[i]++;
        }
      }
      setInterval(draw, 50);
    }
    startMatrixRain();
  </script>
</body>
</html>
