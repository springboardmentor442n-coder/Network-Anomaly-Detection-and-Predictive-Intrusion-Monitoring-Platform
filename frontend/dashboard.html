<!DOCTYPE html>
<html>
<head>
  <title>NetShield AI - Dashboard</title>
</head>
<body>
  <h2>NetShield AI Dashboard</h2>
  <p id="welcome">Loading...</p>
  <div id="stats"></div>

  <script>
    async function loadDashboard() {
      const token = localStorage.getItem('token');
      if (!token) { window.location.href = 'login.html'; return; }

      const res1 = await fetch('http://127.0.0.1:8000/dashboard', { headers: { 'Authorization': 'Bearer ' + token } });
      const data1 = await res1.json();
      document.getElementById('welcome').innerText = data1.message;

      const res2 = await fetch('http://127.0.0.1:8000/traffic-stats', { headers: { 'Authorization': 'Bearer ' + token } });
      const stats = await res2.json();
      document.getElementById('stats').innerHTML =
        '<p>Total flows analyzed: ' + stats.total_flows + '</p>' +
        '<p>Benign traffic: ' + stats.benign_count + '</p>' +
        '<p>Attacks detected: ' + stats.attack_count + '</p>' +
        '<h3>Top attack types:</h3><ul>' +
        Object.entries(stats.top_attack_types).map(([k, v]) => '<li>' + k + ': ' + v + '</li>').join('') +
        '</ul>';
    }
    loadDashboard();
  </script>
</body>
</html>
