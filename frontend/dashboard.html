<!DOCTYPE html>
<html>
<head>
  <title>NetShield AI - Dashboard</title>
</head>
<body>
  <h2>NetShield AI Dashboard</h2>
  <p id="welcome">Loading...</p>

  <script>
    async function loadDashboard() {
      const token = localStorage.getItem('token');
      if (!token) {
        window.location.href = 'login.html';
        return;
      }

      const response = await fetch('http://127.0.0.1:8000/dashboard', {
        headers: { 'Authorization': 'Bearer ' + token }
      });

      if (response.ok) {
        const data = await response.json();
        document.getElementById('welcome').innerText = data.message;
      } else {
        document.getElementById('welcome').innerText = 'Session expired. Please log in again.';
      }
    }

    loadDashboard();
  </script>
</body>
</html>
