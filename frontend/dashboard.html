<!DOCTYPE html>
<html>
<head>
  <title>NetShield AI - Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="navbar">
    <h2>NetShield AI Dashboard</h2>
  </div>

  <div class="dashboard-content">
    <p id="welcome">Loading...</p>
    <div class="stats-grid" id="stats-grid"></div>
    <div class="attack-list">
      <h3>Top Attack Types</h3>
      <ul id="attack-list"></ul>
    </div>

    <div class="live-section">
      <div class="live-header">
        <h3>Live Threat Monitor</h3>
        <button id="liveBtn" onclick="toggleLive()">Start Monitoring</button>
      </div>
      <div id="liveFeed"></div>
    </div>

    <div class="report-trigger">
      <button id="reportBtn" onclick="generateReport()">📄 Generate Report</button>
    </div>
  </div>

  <div id="reportModal" class="report-modal hidden">
    <div class="report-paper">
      <div class="report-actions">
        <button onclick="window.print()">Print / Save as PDF</button>
        <button onclick="closeReport()">Close</button>
      </div>
      <div class="report-header">
        <h1>NetShield AI</h1>
        <p>Network Threat Detection Report</p>
        <p id="reportMeta"></p>
      </div>
      <div class="report-section">
        <h2>Traffic Summary</h2>
        <div id="reportTrafficSummary" class="report-grid"></div>
      </div>
      <div class="report-section">
        <h2>Model Performance</h2>
        <table id="reportModelTable" class="report-table"></table>
      </div>
      <div class="report-section">
        <h2>Risk Level Distribution (Sample Traffic)</h2>
        <div id="reportRiskBars"></div>
      </div>
      <div class="report-section">
        <h2>Top Attack Types Detected</h2>
        <ul id="reportAttackList" class="report-list"></ul>
      </div>
    </div>
  </div>

  <script>
    function goToLogin() {
      localStorage.removeItem('token');
      window.location.href = 'login.html';
    }

    async function loadDashboard() {
      const token = localStorage.getItem('token');
      if (!token) { goToLogin(); return; }

      const res1 = await fetch('http://127.0.0.1:8000/dashboard', { headers: { 'Authorization': 'Bearer ' + token } });
      if (!res1.ok) { goToLogin(); return; }
      const data1 = await res1.json();
      document.getElementById('welcome').innerText = data1.message;

      const res2 = await fetch('http://127.0.0.1:8000/traffic-stats', { headers: { 'Authorization': 'Bearer ' + token } });
      if (!res2.ok) { goToLogin(); return; }
      const stats = await res2.json();

      document.getElementById('stats-grid').innerHTML =
        '<div class="stat-card"><div class="label">Total Flows Analyzed</div><div class="value">' + stats.total_flows.toLocaleString() + '</div></div>' +
        '<div class="stat-card"><div class="label">Benign Traffic</div><div class="value">' + stats.benign_count.toLocaleString() + '</div></div>' +
        '<div class="stat-card"><div class="label">Attacks Detected</div><div class="value">' + stats.attack_count.toLocaleString() + '</div></div>';

      document.getElementById('attack-list').innerHTML =
        Object.entries(stats.top_attack_types).map(([k, v]) =>
          '<li><span>' + k + '</span><span>' + v.toLocaleString() + '</span></li>'
        ).join('');
    }
    loadDashboard();

    let liveInterval = null;

    async function fetchPrediction() {
      const token = localStorage.getItem('token');
      const res = await fetch('http://127.0.0.1:8000/predict-next', { headers: { 'Authorization': 'Bearer ' + token } });
      if (!res.ok) {
        clearInterval(liveInterval);
        liveInterval = null;
        goToLogin();
        return;
      }
      const data = await res.json();

      const feed = document.getElementById('liveFeed');
      const entry = document.createElement('div');
      entry.className = data.prediction === 'ATTACK' ? 'live-entry attack' : 'live-entry benign';

      const riskClass = 'risk-' + data.risk_label.toLowerCase();

      entry.innerHTML =
        '<span class="live-label">' + data.predicted_class + '</span>' +
        '<span class="live-risk ' + riskClass + '">' + data.risk_label + ' (' + data.risk_score + ')</span>' +
        '<span class="live-confidence">' + (data.confidence * 100).toFixed(1) + '%</span>';

      feed.insertBefore(entry, feed.firstChild);
      while (feed.children.length > 15) {
        feed.removeChild(feed.lastChild);
      }
    }

    function toggleLive() {
      const btn = document.getElementById('liveBtn');
      if (liveInterval) {
        clearInterval(liveInterval);
        liveInterval = null;
        btn.innerText = 'Start Monitoring';
        btn.classList.remove('stop');
      } else {
        fetchPrediction();
        liveInterval = setInterval(fetchPrediction, 1500);
        btn.innerText = 'Stop Monitoring';
        btn.classList.add('stop');
      }
    }

    async function generateReport() {
      const token = localStorage.getItem('token');
      const res = await fetch('http://127.0.0.1:8000/generate-report', { headers: { 'Authorization': 'Bearer ' + token } });
      if (!res.ok) { goToLogin(); return; }
      const report = await res.json();

      document.getElementById('reportMeta').innerText =
        'Generated by ' + report.generated_by + ' on ' + report.generated_at;

      document.getElementById('reportTrafficSummary').innerHTML =
        '<div><span class="report-label">Total Flows</span><span class="report-value">' + report.total_flows.toLocaleString() + '</span></div>' +
        '<div><span class="report-label">Benign</span><span class="report-value">' + report.benign_count.toLocaleString() + '</span></div>' +
        '<div><span class="report-label">Attacks</span><span class="report-value">' + report.attack_count.toLocaleString() + '</span></div>';

      document.getElementById('reportModelTable').innerHTML =
        '<tr><th>Metric</th><th>Score</th></tr>' +
        '<tr><td>Accuracy</td><td>' + report.model_performance.accuracy + '</td></tr>' +
        '<tr><td>Precision (weighted)</td><td>' + report.model_performance.precision + '</td></tr>' +
        '<tr><td>Recall (weighted)</td><td>' + report.model_performance.recall + '</td></tr>' +
        '<tr><td>F1 Score (weighted)</td><td>' + report.model_performance.f1_score + '</td></tr>';

      const riskTotal = report.risk_distribution.Low + report.risk_distribution.Medium + report.risk_distribution.High + report.risk_distribution.Critical;
      document.getElementById('reportRiskBars').innerHTML = ['Low', 'Medium', 'High', 'Critical'].map(level => {
        const count = report.risk_distribution[level];
        const pct = riskTotal ? Math.round((count / riskTotal) * 100) : 0;
        return '<div class="risk-bar-row"><span class="risk-bar-label">' + level + '</span>' +
          '<div class="risk-bar-track"><div class="risk-bar-fill risk-bar-' + level.toLowerCase() + '" style="width:' + pct + '%"></div></div>' +
          '<span class="risk-bar-count">' + count + '</span></div>';
      }).join('');

      document.getElementById('reportAttackList').innerHTML =
        Object.entries(report.top_attack_types).map(([k, v]) =>
          '<li><span>' + k + '</span><span>' + v.toLocaleString() + '</span></li>'
        ).join('');

      document.getElementById('reportModal').classList.remove('hidden');
    }

    function closeReport() {
      document.getElementById('reportModal').classList.add('hidden');
    }
  </script>
</body>
</html>
